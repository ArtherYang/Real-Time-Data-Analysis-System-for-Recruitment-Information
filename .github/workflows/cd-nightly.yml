# ============================================================
# 招聘信息实时数据分析系统 (RDAS) — 每日构建流水线
# ============================================================
# 每日凌晨 3:00 (UTC+8) 自动构建最新镜像，并进行安全扫描。
#
# AI生成，待人工审查。
# ============================================================

name: Nightly Build & Scan

on:
  schedule:
    # 每日 UTC 19:00 = 北京时间 03:00
    - cron: "0 19 * * *"
  workflow_dispatch:  # 允许手动触发

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/rdas-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/rdas-frontend

jobs:

  build:
    name: Nightly Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- 构建后端 ----
      - name: Build & push backend (nightly)
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 构建前端 ----
      - name: Build & push frontend (nightly)
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- 安全扫描 ----
  scan:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy scanner (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:nightly
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          output: trivy-backend.txt

      - name: Run Trivy scanner (frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:nightly
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          output: trivy-frontend.txt

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: |
            trivy-backend.txt
            trivy-frontend.txt
          retention-days: 7

      - name: Check for critical vulnerabilities
        run: |
          echo "=== Backend Scan ==="
          cat trivy-backend.txt
          echo "=== Frontend Scan ==="
          cat trivy-frontend.txt
