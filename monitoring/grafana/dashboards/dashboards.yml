# ============================================================
# Grafana Dashboard 自动加载配置
# ============================================================
apiVersion: 1

providers:
  - name: "RDAS"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
