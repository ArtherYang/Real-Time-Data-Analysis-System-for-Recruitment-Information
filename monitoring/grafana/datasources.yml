# ============================================================
# 招聘信息实时数据分析系统 (RDAS) — Grafana 数据源预配置
# ============================================================
# 自动配置 Prometheus（指标）和 Loki（日志）数据源。
#
# AI生成，待人工审查。
# ============================================================

apiVersion: 1

datasources:
  # ---- Prometheus 指标 ----
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      queryTimeout: 30s

  # ---- Loki 日志 ----
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields: []
