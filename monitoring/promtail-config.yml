# ============================================================
# 招聘信息实时数据分析系统 (RDAS) — Promtail 日志采集配置
# ============================================================
# 采集 Docker 容器日志，按 service / level / environment 打标签。
#
# AI生成，待人工审查。
# ============================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ---- Docker 容器日志 ----
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # 只采集 RDAS 相关容器
      - source_labels: [__meta_docker_container_name]
        regex: "/(rdas-.+)"
        target_label: container_name
      - source_labels: [__meta_docker_container_name]
        regex: "/(rdas-.+)"
        action: keep
      # 提取服务名
      - source_labels: [__meta_docker_container_name]
        regex: "/rdas-(.+)"
        target_label: service
      # 从容器标签提取日志级别（如有）
      - source_labels: [__meta_docker_container_label_log_level]
        regex: "(.+)"
        target_label: level
      # 环境标识
      - source_labels: [__meta_docker_container_label_environment]
        regex: "(.+)"
        target_label: environment
    pipeline_stages:
      - docker: {}
      # 解析日志时间戳
      - timestamp:
          source: time
          format: RFC3339
      # 提取日志级别（INFO/WARNING/ERROR/DEBUG）
      - regex:
          expression: '(?i)\b(DEBUG|INFO|WARNING|WARN|ERROR|CRITICAL|FATAL)\b'
      - labels:
          level:
      # 静态环境标签
      - static_labels:
          environment: production

  # ---- 系统日志（可选） ----
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/*.log
